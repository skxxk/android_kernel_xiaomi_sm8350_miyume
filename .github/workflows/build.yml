name: Build Venus Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Patch venus_defconfig
        run: |
          set -e
          DEF=arch/arm64/configs/venus_defconfig
          sed -i 's/^CONFIG_MODVERSIONS=y$/# CONFIG_MODVERSIONS is not set/' $DEF
          sed -i '/# ===== third-party module support =====/,$d' $DEF
          printf '\n# ===== third-party module support =====\nCONFIG_DEBUG_KERNEL=y\nCONFIG_KPROBES=y\nCONFIG_KRETPROBES=y\nCONFIG_TRACE_IRQFLAGS=y\nCONFIG_DEBUG_SPINLOCK=y\nCONFIG_DEBUG_PREEMPT=y\n' >> $DEF
          sed -i 's/^# CONFIG_DEBUG_PREEMPT is not set$/CONFIG_DEBUG_PREEMPT=y/' $DEF
          echo "===== AFTER ====="
          grep -n "MODVERSIONS\|KPROBES\|DEBUG_KERNEL\|TRACE_IRQFLAGS\|DEBUG_SPINLOCK\|DEBUG_PREEMPT" $DEF || true

      - name: Check submodules
        run: |
          ls -la KernelSU || echo "KernelSU missing"
          ls -la KernelSU/kernel 2>/dev/null || true

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl wget flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32readline-dev lib32ncurses5-dev \
            lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python-is-python3 libfdt-dev device-tree-compiler

      - name: Download AOSP Clang 18
        run: |
          set -e
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          URL=https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          curl -fL --retry 3 --retry-delay 5 -o clang.tar.gz "$URL"
          mkdir -p clang && tar -xzf clang.tar.gz -C clang
          ls -la clang/bin/clang

      - name: Verify toolchain
        run: |
          set -e
          export PATH=$HOME/toolchains/clang/bin:$PATH
          which clang
          clang --version

      - name: Build kernel Image
        run: |
          set -e
          export PATH=$HOME/toolchains/clang/bin:$PATH
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out venus_defconfig
          echo "===== .config key items ====="
          grep -E "CONFIG_KPROBES=|CONFIG_KRETPROBES=|CONFIG_DEBUG_KERNEL=|CONFIG_TRACE_IRQFLAGS=|CONFIG_DEBUG_SPINLOCK=|CONFIG_DEBUG_PREEMPT=|CONFIG_MODVERSIONS" out/.config || true
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image

      - name: Verify symbols in Image
        run: |
          IMG=out/arch/arm64/boot/Image
          echo "===== SYMBOL CHECK ====="
          for s in register_kprobe unregister_kprobe register_kretprobe unregister_kretprobe _raw_spin_lock _raw_spin_unlock _raw_spin_lock_irqsave _raw_spin_unlock_irqrestore _raw_read_lock _raw_read_unlock trace_hardirqs_on trace_hardirqs_off preempt_count_add preempt_count_sub; do
            printf "%-32s " "$s"
            strings $IMG | grep -c "^${s}$"
          done

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-venus
          path: out/arch/arm64/boot/Image
          if-no-files-found: error