name: Build Venus Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show defconfig markers
        run: |
          DEF=arch/arm64/configs/venus_defconfig
          echo "===== MODVERSIONS ====="
          grep -n "MODVERSIONS" $DEF || true
          echo "===== KPROBES / DEBUG ====="
          grep -n "KPROBES\|DEBUG_SPINLOCK\|DEBUG_PREEMPT\|TRACE_IRQFLAGS" $DEF || true
          echo "===== total lines ====="
          wc -l $DEF

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32readline-dev lib32ncurses5-dev \
            lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python-is-python3

      - name: Install Clang 18.1.8
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-aarch64-linux-gnu.tar.xz || \
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          ls -la

      - name: Build kernel
