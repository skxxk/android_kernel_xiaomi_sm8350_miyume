- name: Generate .config
  run: |
    set -euo pipefail
    export PATH="$HOME/toolchains/clang/bin:$PATH"
    export LD_LIBRARY_PATH="$HOME/libtinfo5/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
    
    printf 'Generating .config from venus_defconfig...\n'
    
    make -j"$(nproc --all)" \
      O=out \
      ARCH=arm64 \
      LLVM=1 \
      LLVM_IAS=1 \
      venus_defconfig
    
    printf '.config generated. Verification:\n'
    head -20 out/.config