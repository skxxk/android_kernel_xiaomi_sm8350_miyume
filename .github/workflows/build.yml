name: Build Venus Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    
    env:
      CLANG_VERSION: 18.1.8
      CLANG_URL: https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz
      LIBTINFO_URL: http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.2-0ubuntu2_amd64.deb
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install libtinfo5
        run: |
          set -euo pipefail
          printf 'Installing libtinfo5 for Clang %s compatibility...\n' "$CLANG_VERSION"
          
          curl -fsSL "$LIBTINFO_URL" -o libtinfo5.deb
          dpkg-deb -x libtinfo5.deb "$HOME/libtinfo5"
          
          if [[ ! -f "$HOME/libtinfo5/lib/x86_64-linux-gnu/libtinfo.so.5" ]]; then
            printf 'Error: libtinfo.so.5 not found\n' >&2
            exit 1
          fi
          
          printf 'LIBTINFO_PATH=%s\n' "$HOME/libtinfo5/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
          printf 'LD_LIBRARY_PATH=%s\n' "$HOME/libtinfo5/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
          printf 'libtinfo5 installed: %s\n' "$(ls -lh "$HOME/libtinfo5/lib/x86_64-linux-gnu/libtinfo.so"*)"
      
      - name: Download Clang
        run: |
          set -euo pipefail
          printf 'Downloading Clang %s...\n' "$CLANG_VERSION"
          
          curl -fsSL "$CLANG_URL" -o clang.tar.xz
          mkdir -p "$HOME/toolchains"
          tar -xf clang.tar.xz -C "$HOME/toolchains"
          mv "$HOME/toolchains/clang+llvm-${CLANG_VERSION}-x86_64-linux-gnu-ubuntu-18.04" "$HOME/toolchains/clang"
          
          if [[ ! -x "$HOME/toolchains/clang/bin/clang" ]]; then
            printf 'Error: clang binary not found or not executable\n' >&2
            exit 1
          fi
          
          printf 'CLANG_BIN=%s\n' "$HOME/toolchains/clang/bin" >> "$GITHUB_ENV"
          printf '%s\n' "$HOME/toolchains/clang/bin" >> "$GITHUB_PATH"
          printf 'Clang installed: %s\n' "$("$HOME/toolchains/clang/bin/clang" --version | head -1)"
      
      - name: Patch defconfig
        run: |
          set -euo pipefail
          DEF="arch/arm64/configs/venus_defconfig"
          
          printf 'Patching %s for TwT driver symbol exports...\n' "$DEF"
          
          sed -i 's|^CONFIG_MODVERSIONS=y$|# CONFIG_MODVERSIONS is not set|' "$DEF"
          sed -i 's|^# CONFIG_KPROBES is not set$|CONFIG_KPROBES=y|' "$DEF"
          sed -i 's|^# CONFIG_KPROBE_EVENTS is not set$|CONFIG_KPROBE_EVENTS=y|' "$DEF"
          sed -i 's|^# CONFIG_DEBUG_SPINLOCK is not set$|CONFIG_DEBUG_SPINLOCK=y|' "$DEF"
          sed -i 's|^# CONFIG_DEBUG_LOCK_ALLOC is not set$|CONFIG_DEBUG_LOCK_ALLOC=y|' "$DEF"
          sed -i 's|^# CONFIG_DEBUG_PREEMPT is not set$|CONFIG_DEBUG_PREEMPT=y|' "$DEF"
          
          printf 'Patching complete. Verification:\n'
          grep -E 'CONFIG_(MODVERSIONS|KPROBES|KPROBE_EVENTS|DEBUG_SPINLOCK|DEBUG_LOCK_ALLOC|DEBUG_PREEMPT)' "$DEF" || true
      
      - name: Patch kernel/softirq.c
        run: |
          set -euo pipefail
          printf 'Patching kernel/softirq.c for trace_hardirqs_on/off symbols...\n'
          
          printf '\n/* Shim functions for TwT driver - undef macros first */\n' >> kernel/softirq.c
          printf '#ifdef trace_hardirqs_on\n' >> kernel/softirq.c
          printf '#undef trace_hardirqs_on\n' >> kernel/softirq.c
          printf '#endif\n' >> kernel/softirq.c
          printf '#ifdef trace_hardirqs_off\n' >> kernel/softirq.c
          printf '#undef trace_hardirqs_off\n' >> kernel/softirq.c
          printf '#endif\n' >> kernel/softirq.c
          printf '\n' >> kernel/softirq.c
          printf 'void trace_hardirqs_on(void)\n' >> kernel/softirq.c
          printf '{\n' >> kernel/softirq.c
          printf '    /* Intentionally empty - shim for TwT driver */\n' >> kernel/softirq.c
          printf '}\n' >> kernel/softirq.c
          printf 'EXPORT_SYMBOL(trace_hardirqs_on);\n' >> kernel/softirq.c
          printf '\n' >> kernel/softirq.c
          printf 'void trace_hardirqs_off(void)\n' >> kernel/softirq.c
          printf '{\n' >> kernel/softirq.c
          printf '    /* Intentionally empty - shim for TwT driver */\n' >> kernel/softirq.c
          printf '}\n' >> kernel/softirq.c
          printf 'EXPORT_SYMBOL(trace_hardirqs_off);\n' >> kernel/softirq.c
          
          printf 'Verification:\n'
          tail -20 kernel/softirq.c
      
      - name: Build Kernel
        run: |
          set -euo pipefail
          export PATH="$HOME/toolchains/clang/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/libtinfo5/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          
          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            Image
      
      - name: Verify Symbol Exports
        run: |
          set -euo pipefail
          printf 'Verifying TwT driver symbol exports...\n\n'
          
          REQUIRED_SYMBOLS=(
            "register_kprobe"
            "unregister_kprobe"
            "register_kretprobe"
            "unregister_kretprobe"
            "_raw_spin_lock"
            "_raw_spin_unlock"
            "_raw_spin_lock_irqsave"
            "_raw_spin_unlock_irqrestore"
            "_raw_read_lock"
            "_raw_read_unlock"
            "trace_hardirqs_on"
            "trace_hardirqs_off"
            "preempt_count_add"
            "preempt_count_sub"
          )
          
          MISSING=0
          for sym in "${REQUIRED_SYMBOLS[@]}"; do
            if grep -qw "$sym" out/Module.symvers 2>/dev/null || \
               grep -qw "$sym" out/System.map 2>/dev/null; then
              printf '✓ %s\n' "$sym"
            else
              printf '✗ %s (MISSING)\n' "$sym"
              MISSING=$((MISSING + 1))
            fi
          done
          
          printf '\nSummary: %d/%d symbols exported\n' "$((${#REQUIRED_SYMBOLS[@]} - MISSING))" "${#REQUIRED_SYMBOLS[@]}"
          
          if [[ "$MISSING" -gt 0 ]]; then
            printf '\nError: %d required symbols missing\n' "$MISSING" >&2
            exit 1
          fi
          
          printf '\n✅ All 14 symbols verified\n'
      
      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: venus-kernel-${{ github.sha }}
          path: out/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 30